<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="کافه کتاب و محصولات فرهنگی">
    <title>بله|کافه کتاب آنلاین</title>
    <link rel="stylesheet" href="styles/app.css">
    <link rel="icon" type="image/png" href="picture/images.png">
    <style>
        *{
            font-family:"Vazir Medium" ;
            box-sizing: border-box;
            outline:none;
            
        }
        header{
            background-color:#f4f5f7;
            height: 64.8px;
            width: 1536px;
            border-bottom: 1px solid #dfe1e6;
            padding: 12px 0 12px 0;
            min-height: auto;
            min-width: auto;
            display: flex;
            position: sticky;
        }
        .lego_bale{
            height: 40px;
            width: 40px;
            min-height: auto;
            min-width: auto;
            display: block;
            margin-right: 150px;
        }
        .button_download{
            background-color: white;
            height: 40px;
            width: 160px;
            border: 2px solid #00b894;
            min-height: auto;
            max-width: 160px;
            min-width: auto;
            display:block;
            border-radius: 10px;
            text-align:center;
        }
        .box_header{
            display: flex;
            justify-content: space-between;
            width: 1320px;
        }

        .link_download{
            text-decoration: none;
            font-size: 15px;
            color: #00b894;
        }
        /*_____________________________________*/
       main{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }
       form{
            background-color: #fff;
            border-radius: 12px;
            padding: 20px 28px;
            width: 400px;
            
        }
        button{
            width: 100%;
            border: 1px solid #ded9ee;
            padding: 8px;
            border-radius: 8px;
            color: #1b1b1b;
            display: block;
            transition: 180ms ease-in border-color;
            cursor: pointer;
            background-color:#4A2C2A ;
            
        }
        .view_web{
            text-decoration: none;
            color: white;
        }
        img{
            display: block;
            width: 150px;
            margin: 0 auto;
        }
        .paragraph{
            text-align: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="box_header">
            <a href="https://ble.ir/">
                <img class="lego_bale" src="./picture/New-Logo-of-Bale-1030x1030.png" alt="image">
            </a>
            <button class="button_download"><a class="link_download" href="https://bale.ai/#download_section">دانلود بله</a></button>
        </div>
    </header><br>
    <main>
        <form action="">
        <img src="./picture/images-removebg-preview.png" alt="logo">
        <br>
        <div class="paragraph">
            <h3>کافه کتاب آنلاین</h3>
            <p>خرید کتاب و محصولات فرهنگی</p>
        </div>
        <br>
        <button><a class="view_web" href="https://web.bale.ai/@onlinebookcity">مشاهده در وب بله</a></button>
    </form>
    </main>
    
</body>
</html>
